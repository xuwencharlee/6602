<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮件处理任务</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{font-family:'DM Sans','Noto Sans SC',sans-serif;color:#202b28;background:#f5f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:48px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-size:13px;font-weight:700;letter-spacing:.13em;color:#587166}.brand span{display:inline-grid;place-items:center;background:#dcebe1;color:#376049;width:34px;height:34px;border-radius:11px;margin-right:10px;font-size:17px}.top small{color:#87928d}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.eyebrow{font-size:12px;color:#73847c;text-transform:uppercase;letter-spacing:.16em;font-weight:700}.heading h1{font-size:34px;letter-spacing:-.04em;margin:8px 0 5px}.heading p{margin:0;color:#7b8781}.count{color:#728078;font-size:13px}.panel{background:#fff;border:1px solid #e8ece8;border-radius:18px;box-shadow:0 8px 28px #243c2d08}.tabs{padding:18px 22px 0;border-bottom:1px solid #edf0ed;display:flex;gap:24px}.tab{border:0;background:none;color:#87928d;padding:0 0 16px;font:600 14px inherit;cursor:pointer;position:relative}.tab.active{color:#276143}.tab.active:after{content:'';height:2px;position:absolute;bottom:-1px;left:0;right:0;background:#43865d;border-radius:2px}.badge{font-size:11px;background:#eff3ef;padding:3px 7px;border-radius:20px;margin-left:5px}.list{padding:8px 22px}.task{padding:20px 0;border-bottom:1px solid #eef1ee;display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:start}.task:last-child{border-bottom:0}.check{width:25px;height:25px;border:1.5px solid #cbd5ce;border-radius:8px;background:#fff;color:white;cursor:pointer;margin-top:2px}.done .check{background:#43865d;border-color:#43865d}.taskmain{min-width:0}.subject{font-size:15px;font-weight:600;margin:2px 0 8px;line-height:1.5}.done .subject{color:#86918b;text-decoration:line-through}.body{font-size:13px;line-height:1.75;color:#75817b;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;align-items:center;gap:9px;margin-top:12px;color:#9aa49e;font-size:11px}.tag{color:#507961;background:#edf5ef;padding:4px 8px;border-radius:20px}.id{font:11px 'DM Sans',sans-serif;color:#98a29b}.actions{display:flex;gap:7px}.icon{font-size:12px;color:#829087;border:1px solid #e8ede8;border-radius:8px;padding:6px 9px;cursor:pointer;background:#fff}.empty{text-align:center;padding:70px 20px;color:#8a958e}.empty b{display:block;color:#43564b;font-size:16px;margin:10px}.empty span{font-size:13px}.footer{display:flex;justify-content:space-between;padding:16px 22px;border-top:1px solid #edf0ed;color:#99a39d;font-size:11px}.pulse{width:7px;height:7px;background:#70ae7d;border-radius:50%;display:inline-block;margin-right:6px}@media(max-width:640px){.shell{padding:28px 15px}.heading h1{font-size:27px}.task{grid-template-columns:30px 1fr}.actions{grid-column:2}.id{display:none}.count{font-size:11px}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><span>✉</span>INBOX FLOW</div><small id="today"></small></div><div class="heading"><div><div class="eyebrow">工作台 / 邮件队列</div><h1>邮件处理任务</h1><p>集中查看并处理通过 webhook 推送的邮件回复任务。</p></div><div class="count" id="summary"></div></div><section class="panel"><nav class="tabs"><button class="tab active" data-tab="pending">待处理 <span class="badge" id="pendingCount">0</span></button><button class="tab" data-tab="done">已处理 <span class="badge" id="doneCount">0</span></button><button class="tab" data-tab="all">全部任务 <span class="badge" id="allCount">0</span></button></nav><div class="list" id="list"></div><div class="footer"><span><i class="pulse"></i>Webhook 服务运行中</span><span>POST /webhook · 自动同步</span></div></section></main><script>
const list=document.querySelector('#list');let tasks=[],tab='pending';document.querySelector('#today').textContent=new Intl.DateTimeFormat('zh-CN',{dateStyle:'full'}).format(new Date());
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const pending=tasks.filter(t=>!t.done).length,done=tasks.length-pending;document.querySelector('#pendingCount').textContent=pending;document.querySelector('#doneCount').textContent=done;document.querySelector('#allCount').textContent=tasks.length;document.querySelector('#summary').textContent=`${pending} 个待处理 · ${done} 个已完成`;const rows=tasks.filter(t=>tab==='all'||(tab==='done'?t.done:!t.done));list.innerHTML=rows.length?rows.map(t=>`<article class="task ${t.done?'done':''}"><button class="check" data-action="toggle" data-id="${esc(t.ticket_id)}">${t.done?'✓':''}</button><div class="taskmain"><div class="subject">${esc(t.email_subject||'（无邮件主题）')}</div><div class="body">${esc(t.email_body||'（无回复内容）')}</div><div class="meta"><span class="tag">${esc(t.jev_result||'order')}</span><span>Ticket</span><code class="id">${esc(t.ticket_id)}</code><span>· ${esc(new Date(t.created_at).toLocaleString('zh-CN'))}</span></div></div><div class="actions"><button class="icon" data-action="copy" data-id="${esc(t.ticket_id)}">复制回复</button></div></article>`).join(''):`<div class="empty">✉<b>${tab==='done'?'还没有已处理任务':'收件箱很安静'}</b><span>${tab==='pending'?'等待 webhook 推送新邮件任务。':'切换到其他标签查看任务。'}</span></div>`}document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;render()});list.onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const t=tasks.find(x=>x.ticket_id===b.dataset.id);if(!t)return;if(b.dataset.action==='toggle'){t.done=!t.done;await fetch('/api/tasks/'+encodeURIComponent(t.ticket_id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:t.done})});render()}else{await navigator.clipboard.writeText(t.email_body||'');b.textContent='已复制';setTimeout(()=>b.textContent='复制回复',1200)}};async function sync(){try{const r=await fetch('/api/tasks');if(r.ok){tasks=await r.json();render()}}catch{}}sync();setInterval(sync,2500);
</script></body></html>
